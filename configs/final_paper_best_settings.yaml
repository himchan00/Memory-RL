# Best-setting manifest from the result workbooks; not an AMLT submission file.
schema_version: 1

selection:
  metric: Final_Return_mean
  direction: maximize
  group_by: [environment, seq_model]
  source_sheet: Summary
  candidate_settings_per_model: 10
  ema_decay: 0.9
  final_window_episodes: 25000
  standard_deviation: sample

sources:
  ant-dir:
    workbook: ant_final_paper_baselines_interpolated_padded.xlsx
    sha256: ce331f79be5c65a3b66017a8ae29d2840b8fba68fbf5da59fbe3b7ab63f0c043
    included_runs: 200
    excluded_runs: []
  walker-param:
    workbook: walker_final_paper_baselines_interpolated_padded.xlsx
    sha256: 367dcf4899788ba9893b13c631b01c71ef8c7df1a4560184f62ba919d5c280e2
    included_runs: 199
    excluded_runs: [walker_gpt_h256_l4_rl1x512_s3]

shared_training:
  config_env: configs/envs/mujoco.py
  config_rl: configs/rl/sac_default.py
  train_episodes: 250000
  max_seq_len: 32
  seeds: [0, 1, 2, 3]

model_configs:
  gpt:
    config_seq: configs/seq_models/gpt_default.py
    project_output: false
  lstm:
    config_seq: configs/seq_models/lstm_default.py
    project_output: false
  splagger:
    config_seq: configs/seq_models/splagger_default.py
    project_output: false
  mateproj:
    config_seq: configs/seq_models/mate_default.py
    project_output: true
  mate:
    config_seq: configs/seq_models/mate_default.py
    project_output: false

# Preserve the coupled architecture flags from final_paper_baselines.yaml.
parameter_bindings:
  environment: [config_env.env_name]
  hidden_dim: [config_seq.seq_model.hidden_size, config_seq.conditioning_hidden_dim]
  n_layer: [config_seq.seq_model.n_layer, config_seq.conditioning_n_layer]
  network_size: [config_rl.config_actor.hidden_dims, config_rl.config_critic.hidden_dims]
  project_output: [config_seq.project_output]
  gpt_only:
    n_layer: [config_seq.seq_model.n_head]

