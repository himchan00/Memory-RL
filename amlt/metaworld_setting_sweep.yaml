# yaml-language-server: $schema=file:///home/v-hihwang/Memory-RL/.vscode/amlt-config.schema.json
description: >
  Metaworld ML10/ML45 setting sweep (v2): GPT, LSTM, SplAgger, MATE, and
  mate_proj use h256/h512; Oracle/Markov use h512/h1024.
  2 environments x 14 model-width pairs x 3 depths (1/2/4)
  x 6 seeds (0-5) = 504 jobs.
  All runs use max_seq_len=128, train_episodes=250000, and SAC defaults.
  Oracle/Markov depth and width apply to the observation MLP.
  Only mate_proj enables output projection.

target:
  service: manifold
  name: msrresrchbasicvc
  workspace_name: wsgcrrbt

env_defaults:
  BASE_DIR: /mnt/v-hihwang/projects/mate

storage:
  my_storage:
    storage_account_name: azsussc
    container_name: v-hihwang
    mount_dir: /mnt/v-hihwang

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  setup:
    - conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
    - conda create -y -n mate python=3.10
    - conda run --name mate conda install -y -c conda-forge "mesalib<25.1" libstdcxx-ng
    - conda run --name mate pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu126
    - conda run --name mate pip install -r requirements.txt

code:
  local_dir: $CONFIG_DIR/..

search:
  job_template:
    name: "{env_key}_{variant_key}_l{n_layer}_s{seed}_v2"
    sku: 1x32G1-V100
    process_count_per_node: 1
    sla_tier: Basic
    execution_mode: basic
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: default
        SHARED_MEMORY_PERCENT: 0.5
        WANDB_API_KEY: "$WANDB_API_KEY"
        WANDB_ENTITY: mate_research
        PYTHONUNBUFFERED: "1"
        MUJOCO_GL: "osmesa"
        PYOPENGL_PLATFORM: "osmesa"
        OMP_NUM_THREADS: "8"
        MKL_NUM_THREADS: "8"
    command: |
      export LD_LIBRARY_PATH=/home/aiscuser/.conda/envs/mate/lib:$$LD_LIBRARY_PATH

      case "{env_key}" in
        ml10)
          ENV_NAME="ML10"
          ;;
        ml45)
          ENV_NAME="ML45"
          ;;
        *)
          echo "[ERROR] Unknown environment key: {env_key}" >&2
          exit 2
          ;;
      esac

      case "{n_layer}" in
        1|2|4)
          N_LAYER="{n_layer}"
          ;;
        *)
          echo "[ERROR] Unknown depth: {n_layer}" >&2
          exit 2
          ;;
      esac
      HIDDEN_SIZE=$$(printf '%s' "{variant_key}" | sed 's/.*_h//')

      case "{variant_key}" in
        gpt_h256|gpt_h512)
          SEQ_CONFIG="gpt_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer=$$N_LAYER --config_seq.seq_model.n_head=$$N_LAYER --config_seq.project_output=False"
          ;;
        lstm_h256|lstm_h512)
          SEQ_CONFIG="lstm_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer=$$N_LAYER --config_seq.project_output=False"
          ;;
        splagger_h256|splagger_h512)
          SEQ_CONFIG="splagger_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer=$$N_LAYER --config_seq.project_output=False"
          ;;
        oracle_h512|oracle_h1024)
          SEQ_CONFIG="markov_default"
          MODEL_FLAGS="--config_seq.seq_model.is_oracle=True --config_seq.project_output=False"
          ;;
        markov_h512|markov_h1024)
          SEQ_CONFIG="markov_default"
          MODEL_FLAGS="--config_seq.seq_model.is_oracle=False --config_seq.project_output=False"
          ;;
        mate_h256|mate_h512)
          SEQ_CONFIG="mate_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer=$$N_LAYER --config_seq.project_output=False"
          ;;
        mate_proj_h256|mate_proj_h512)
          SEQ_CONFIG="mate_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer=$$N_LAYER --config_seq.project_output=True"
          ;;
        *)
          echo "[ERROR] Unknown model-width pair: {variant_key}" >&2
          exit 2
          ;;
      esac
      EXTRA_FLAGS="--config_seq.seq_model.hidden_size=$$HIDDEN_SIZE --config_seq.conditioning_hidden_dim=$$HIDDEN_SIZE --config_seq.conditioning_n_layer=$$N_LAYER $$MODEL_FLAGS"

      RESUME_DIR=${BASE_DIR}/Metaworld/$$ENV_NAME/$$AMLT_JOB_NAME\_$$AMLT_EXPERIMENT_NAME
      if [ -f "$$RESUME_DIR/training_checkpoint.pth" ]; then
        echo "[INFO] Resuming from $$RESUME_DIR"
        RESUME_FLAG="--resume $$RESUME_DIR"
      else
        echo "[INFO] Fresh scratch run (no checkpoint at $$RESUME_DIR)"
        RESUME_FLAG=""
      fi

      conda run --no-capture-output --name mate \
        python main.py \
        --config_env=configs/envs/metaworld.py \
        --config_env.env_name=$$ENV_NAME \
        --config_rl=configs/rl/sac_default.py \
        --config_seq=configs/seq_models/$$SEQ_CONFIG.py \
        --max_seq_len=128 \
        $$EXTRA_FLAGS \
        --train_episodes=250000 \
        --seed={seed} \
        --device=0 \
        --run_name=$$AMLT_JOB_NAME \
        --timestamp=$$AMLT_EXPERIMENT_NAME \
        --save_dir=${BASE_DIR} \
        $$RESUME_FLAG

  type: grid
  max_trials: 504
  params:
    - name: env_key
      spec: discrete
      values: [ml10, ml45]
    - name: variant_key
      spec: discrete
      values:
        - gpt_h256
        - gpt_h512
        - lstm_h256
        - lstm_h512
        - splagger_h256
        - splagger_h512
        - oracle_h512
        - oracle_h1024
        - markov_h512
        - markov_h1024
        - mate_h256
        - mate_h512
        - mate_proj_h256
        - mate_proj_h512
    - name: n_layer
      spec: discrete
      values: [1, 2, 4]
    - name: seed
      spec: discrete
      values: [0, 1, 2, 3, 4, 5]
