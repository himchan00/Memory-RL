description: >
  Symbolic Alchemy (DeepMind Alchemy, arXiv:2102.02926) baselines on Singularity.
  Default level = rotation_random_bottleneck (full difficulty). One gym episode =
  one 10-trial meta-episode sharing a hidden chemistry (run with --k 1). DQN
  (discrete, 40 actions). 4 jobs: mate, gpt, lstm, and an oracle (markov +
  is_oracle=True, upper bound). Per-attempt adaptation curves (return_attempt_0..9)
  are logged automatically. Default seed (42).

  NOTE: dm_alchemy is archived + a special install; the setup block installs the
  SYMBOLIC-only build (no Docker/Unity/GL) after requirements.txt.

target:
  service: sing
  workspace_name: wsgcrrbt
  name: msrresrchbasicvc

env_defaults:
  BASE_DIR: /mnt/v-hihwang/projects/mate

storage:
  my_storage:
    storage_account_name: azsussc
    container_name: v-hihwang
    mount_dir: /mnt/v-hihwang

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  setup:
    - conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
    - conda create -y -n mate python=3.10
    - conda run --name mate conda install -y -c conda-forge mesa libstdcxx-ng
    - conda run --name mate pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu126
    - conda run --name mate pip install -r requirements.txt
    # --- symbolic dm_alchemy (archived; symbolic-only, no Docker/Unity/GL) ---
    - bash scripts/install_dm_alchemy.sh mate

code:
  local_dir: $CONFIG_DIR/..

jobs:
  - name: alchemy_mate_no_popart_clip_1
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: &common_env
          AMLT_DOCKERFILE_TEMPLATE: default
          SHARED_MEMORY_PERCENT: 0.5
          WANDB_API_KEY: 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
          WANDB_ENTITY: mate_research
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "8"
          MKL_NUM_THREADS: "8"
          EXTRA_FLAGS: ""
        ENV_NAME: "rotation_random_bottleneck"
        SEQ_CONFIG: "mate_default"
    command:
      - &setup_cmd "export LD_LIBRARY_PATH=/home/aiscuser/.conda/envs/mate/lib:$$LD_LIBRARY_PATH"
      - &run_cmd |
        RESUME_DIR=${BASE_DIR}/alchemy/$$ENV_NAME/$$AMLT_JOB_NAME\_$$AMLT_EXPERIMENT_NAME
        if [ -f "$$RESUME_DIR/training_checkpoint.pth" ]; then
          echo "[INFO] Resuming from $$RESUME_DIR"
          RESUME_FLAG="--resume $$RESUME_DIR"
        else
          echo "[INFO] Fresh scratch run (no checkpoint at $$RESUME_DIR)"
          RESUME_FLAG=""
        fi
        conda run --no-capture-output --name mate \
          python main.py \
          --config_env=configs/envs/alchemy.py \
          --config_env.env_name=$$ENV_NAME \
          --config_rl=configs/rl/dqn_default.py \
          --config_seq=configs/seq_models/$$SEQ_CONFIG.py \
          $$EXTRA_FLAGS \
          --train_episodes=200000 \
          --k=1 \
          --device=0 \
          --run_name=$$AMLT_JOB_NAME \
          --timestamp=$$AMLT_EXPERIMENT_NAME \
          --config_seq.max_norm=1.0 \
          --config_seq.normalize_inputs=false \
          --save_dir=${BASE_DIR} \
          $$RESUME_FLAG

  - name: alchemy_gpt_no_popart_clip_1
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "rotation_random_bottleneck"
        SEQ_CONFIG: "gpt_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: alchemy_lstm_no_popart_clip_1
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "rotation_random_bottleneck"
        SEQ_CONFIG: "lstm_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: alchemy_oracle_no_popart_clip_1
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "rotation_random_bottleneck"
        SEQ_CONFIG: "markov_default"
        EXTRA_FLAGS: "--config_seq.seq_model.is_oracle=True"
    command:
      - *setup_cmd
      - *run_cmd
