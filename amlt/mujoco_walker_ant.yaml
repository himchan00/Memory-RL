description: >
  MuJoCo walker-param + ant-dir: baselines + MATE film-conditioning sweep on Singularity.
  2 envs × 9 jobs = 18 jobs, + 2 gate-reproduction jobs = 20 jobs.
    - gpt, lstm, splagger (defaults)
    - mate: conditioning=film, hidden_size ∈ {256,512,1024} × conditioning_n_layer ∈ {1,2} = 6 per env (12 total)
    - {ant_dir,walker_param}_mate_h256_nl1_gate: explicit use_gate=True reproduction (h=256, n_layer=1)
  Default seed (42), max_episode_steps default (200), train_episodes=250000.
  A100 40G on msrresrchbasicvc.

target:
  service: sing
  workspace_name: wsgcrrbt
  name: msrresrchbasicvc

env_defaults:
  BASE_DIR: /mnt/v-hihwang/projects/mate

storage:
  my_storage:
    storage_account_name: azsussc
    container_name: v-hihwang
    mount_dir: /mnt/v-hihwang

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  setup:
    - conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
    - conda create -y -n mate python=3.10
    - conda run --name mate conda install -y -c conda-forge "mesalib<25.1" libstdcxx-ng
    - conda run --name mate pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu126
    - conda run --name mate pip install -r requirements.txt

code:
  local_dir: $CONFIG_DIR/..

jobs:
  # ============================== walker-param ==============================
  - name: walker_param_gpt
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: &common_env
          AMLT_DOCKERFILE_TEMPLATE: default
          SHARED_MEMORY_PERCENT: 0.5
          WANDB_API_KEY: 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
          WANDB_ENTITY: mate_research
          PYTHONUNBUFFERED: "1"
          MUJOCO_GL: "osmesa"
          PYOPENGL_PLATFORM: "osmesa"
          OMP_NUM_THREADS: "8"
          MKL_NUM_THREADS: "8"
          EXTRA_FLAGS: ""
          TRAIN_EPISODES: "250000"
        ENV_NAME: "walker-param"
        SEQ_CONFIG: "gpt_default"
    command:
      - &setup_cmd "export LD_LIBRARY_PATH=/home/aiscuser/.conda/envs/mate/lib:$$LD_LIBRARY_PATH"
      - &run_cmd |
        RESUME_DIR=${BASE_DIR}/mujoco/$$ENV_NAME/$$AMLT_JOB_NAME\_$$AMLT_EXPERIMENT_NAME
        if [ -f "$$RESUME_DIR/training_checkpoint.pth" ]; then
          echo "[INFO] Resuming from $$RESUME_DIR"
          RESUME_FLAG="--resume $$RESUME_DIR"
        else
          echo "[INFO] Fresh scratch run (no checkpoint at $$RESUME_DIR)"
          RESUME_FLAG=""
        fi
        conda run --no-capture-output --name mate \
          python main.py \
          --config_env=configs/envs/mujoco.py \
          --config_env.env_name=$$ENV_NAME \
          --config_rl=configs/rl/sac_default.py \
          --config_seq=configs/seq_models/$$SEQ_CONFIG.py \
          $$EXTRA_FLAGS \
          --train_episodes=$$TRAIN_EPISODES \
          --device=0 \
          --run_name=$$AMLT_JOB_NAME \
          --timestamp=$$AMLT_EXPERIMENT_NAME \
          --save_dir=${BASE_DIR} \
          $$RESUME_FLAG

  - name: walker_param_mate
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "walker-param"
        SEQ_CONFIG: "mate_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: walker_param_lstm
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "walker-param"
        SEQ_CONFIG: "lstm_default"
    command:
      - *setup_cmd
      - *run_cmd



  # ============================== ant-dir ==============================
  - name: ant_dir_gpt
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ant-dir"
        SEQ_CONFIG: "gpt_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ant_dir_mate
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ant-dir"
        SEQ_CONFIG: "mate_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ant_dir_lstm
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ant-dir"
        SEQ_CONFIG: "lstm_default"
    command:
      - *setup_cmd
      - *run_cmd