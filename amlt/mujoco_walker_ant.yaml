        TRAIN_EPISODES: "200000"
        EXTRA_FLAGS: "--config_seq.conditioning=film --config_seq.seq_model.learnable_pe_scale=False"
    command:
      - *setup_cmd
      - *run_cmd

  # ============================== ant-dir (200000 episodes) ==============================
  - name: ant_dir_gpt
    sku: 1x40G1-A100
