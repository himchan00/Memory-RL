        SEQ_CONFIG: "mate_default"
        TRAIN_EPISODES: "200000"
        EXTRA_FLAGS: "--config_seq.conditioning=film --config_seq.seq_model.add_positional_embedding=False"
    command:
      - *setup_cmd
      - *run_cmd

  - name: walker_param_mate_fix_lambda
    sku: 1x40G1-A100
