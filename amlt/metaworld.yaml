    command:
      - *setup_cmd
      - *run_cmd

  - name: ml45_splagger
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML45"
        SEQ_CONFIG: "splagger_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml45_mate_rff_film_1_layer
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML45"
        SEQ_CONFIG: "mate_default"
        EXTRA_FLAGS: "--config_seq.seq_model.use_rff=True --config_seq.seq_model.n_layer=0 --config_seq.conditioning=film --config_seq.conditioning_n_layer=1"
    command:
      - *setup_cmd
