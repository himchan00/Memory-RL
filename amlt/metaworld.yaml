description: >
  Metaworld baselines + MATE × conditioning ablation on Singularity.
  2 envs (ML10, ML45) × 7 jobs = 14 jobs:
    - gpt, lstm, splagger (defaults: n_layer=1, hidden_size=256, obs_shortcut=False)
    - mate_rff_film_1_layer       (use_rff=True, n_layer=0, conditioning=film, conditioning_n_layer=1)
    - mate_rff_film_1_layer_gate  (use_rff=True, n_layer=0, conditioning=film, conditioning_n_layer=1, use_gate=True)
    - mate_rff_film_2_layer       (use_rff=True, n_layer=0, conditioning=film, conditioning_n_layer=2)
    - mate_rff_film_2_layer_gate  (use_rff=True, n_layer=0, conditioning=film, conditioning_n_layer=2, use_gate=True)
  Default seed (42), max_episode_steps default (500), train_episodes=250000.
  A100 40G on msrresrchbasicvc.

target:
  service: sing
  workspace_name: wsgcrrbt
  name: msrresrchbasicvc

env_defaults:
  BASE_DIR: /mnt/v-hihwang/projects/mate

storage:
  my_storage:
    storage_account_name: azsussc
    container_name: v-hihwang
    mount_dir: /mnt/v-hihwang

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  setup:
    - conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
    - conda create -y -n mate python=3.10
    - conda run --name mate conda install -y -c conda-forge mesa libstdcxx-ng
    - conda run --name mate pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu126
    - conda run --name mate pip install -r requirements.txt

code:
  local_dir: $CONFIG_DIR/..

jobs:
  # ============================== ML10 ==============================
  - name: ml10_gpt
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: &common_env
          AMLT_DOCKERFILE_TEMPLATE: default
          SHARED_MEMORY_PERCENT: 0.5
          WANDB_API_KEY: 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
          WANDB_ENTITY: mate_research
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "8"
          MKL_NUM_THREADS: "8"
          EXTRA_FLAGS: ""
        ENV_NAME: "ML10"
        SEQ_CONFIG: "gpt_default"
    command:
      - &setup_cmd "export LD_LIBRARY_PATH=/home/aiscuser/.conda/envs/mate/lib:$$LD_LIBRARY_PATH"
      - &run_cmd |
        RESUME_DIR=${BASE_DIR}/Metaworld/$$ENV_NAME/$$AMLT_JOB_NAME\_$$AMLT_EXPERIMENT_NAME
        if [ -f "$$RESUME_DIR/training_checkpoint.pth" ]; then
          echo "[INFO] Resuming from $$RESUME_DIR"
          RESUME_FLAG="--resume $$RESUME_DIR"
        else
          echo "[INFO] Fresh scratch run (no checkpoint at $$RESUME_DIR)"
          RESUME_FLAG=""
        fi
        conda run --no-capture-output --name mate \
          python main.py \
          --config_env=configs/envs/metaworld.py \
          --config_env.env_name=$$ENV_NAME \
          --config_rl=configs/rl/sac_default.py \
          --config_seq=configs/seq_models/$$SEQ_CONFIG.py \
          $$EXTRA_FLAGS \
          --train_episodes=250000 \
          --device=0 \
          --run_name=$$AMLT_JOB_NAME \
          --timestamp=$$AMLT_EXPERIMENT_NAME \
          --save_dir=${BASE_DIR} \
          $$RESUME_FLAG

  - name: ml10_lstm
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML10"
        SEQ_CONFIG: "lstm_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml10_splagger
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML10"
        SEQ_CONFIG: "splagger_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml10_mate_rff_film_1_layer
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML10"
        SEQ_CONFIG: "mate_default"
        EXTRA_FLAGS: "--config_seq.seq_model.use_rff=True --config_seq.seq_model.n_layer=0 --config_seq.conditioning=film --config_seq.conditioning_n_layer=1"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml10_mate_rff_film_1_layer_gate
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML10"
        SEQ_CONFIG: "mate_default"
        EXTRA_FLAGS: "--config_seq.seq_model.use_rff=True --config_seq.seq_model.n_layer=0 --config_seq.conditioning=film --config_seq.conditioning_n_layer=1 --config_seq.seq_model.use_gate=True"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml10_mate_rff_film_2_layer
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML10"
        SEQ_CONFIG: "mate_default"
        EXTRA_FLAGS: "--config_seq.seq_model.use_rff=True --config_seq.seq_model.n_layer=0 --config_seq.conditioning=film --config_seq.conditioning_n_layer=2"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml10_mate_rff_film_2_layer_gate
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML10"
        SEQ_CONFIG: "mate_default"
        EXTRA_FLAGS: "--config_seq.seq_model.use_rff=True --config_seq.seq_model.n_layer=0 --config_seq.conditioning=film --config_seq.conditioning_n_layer=2 --config_seq.seq_model.use_gate=True"
    command:
      - *setup_cmd
      - *run_cmd

  # ============================== ML45 ==============================
  - name: ml45_gpt
    sku: 1x40G1-A100
    process_count_per_node: 1
    sla_tier: Standard
    execution_mode: basic
    submit_args:
      env:
        <<: *common_env
        ENV_NAME: "ML45"
        SEQ_CONFIG: "gpt_default"
    command:
      - *setup_cmd
      - *run_cmd

  - name: ml45_lstm
