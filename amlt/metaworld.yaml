        EXTRA_FLAGS: "--config_seq.seq_model.use_rff=True --config_seq.seq_model.n_layer=0 --config_seq.conditioning=film --config_seq.conditioning_n_layer=1 --config_seq.seq_model.use_gate=True"
    command:
