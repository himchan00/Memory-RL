# yaml-language-server: $schema=file:///home/v-hihwang/Memory-RL/.vscode/amlt-config.schema.json
# Submit: amlt run amlt/mujoco_setting_sweep_v2.yaml mujoco_setting_sweep_v2
description: >
  MuJoCo ant/walker/cheetah/hopper setting sweep v2:
  4 environments x 8 model-width settings x 3 depths x 6 seeds = 576 jobs.
  Oracle/Markov use h512/h1024; mate/mate_proj use h256/h512.
  Depths are 1/2/4, seeds are 0-5, and all job/run names end in _v2.
  Oracle/Markov width and depth apply to the observation MLP.
  Training uses max_seq_len=32, with SAC defaults.
  train_episodes: ant-dir=250000, walker-param=250000,
  cheetah-vel=50000, hopper-param=100000.

target:
  service: manifold
  name: msrresrchbasicvc
  workspace_name: wsgcrrbt

env_defaults:
  BASE_DIR: /mnt/v-hihwang/projects/mate

storage:
  my_storage:
    storage_account_name: azsussc
    container_name: v-hihwang
    mount_dir: /mnt/v-hihwang

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  setup:
    - conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
    - conda create -y -n mate python=3.10
    - conda run --name mate conda install -y -c conda-forge "mesalib<25.1" libstdcxx-ng
    - conda run --name mate pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu126
    - conda run --name mate pip install -r requirements.txt

code:
  local_dir: $CONFIG_DIR/..

search:
  job_template:
    name: "{env_key}_{model_width}_l{n_layer}_s{seed}_v2"
    sku: 1x32G1-V100
    process_count_per_node: 1
    sla_tier: Basic
    execution_mode: basic
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: default
        SHARED_MEMORY_PERCENT: 0.5
        WANDB_API_KEY: "$WANDB_API_KEY"
        WANDB_ENTITY: mate_research
        PYTHONUNBUFFERED: "1"
        MUJOCO_GL: "osmesa"
        PYOPENGL_PLATFORM: "osmesa"
        OMP_NUM_THREADS: "8"
        MKL_NUM_THREADS: "8"
    command: |
      export LD_LIBRARY_PATH=/home/aiscuser/.conda/envs/mate/lib:$$LD_LIBRARY_PATH

      case "{env_key}" in
        ant)
          ENV_NAME="ant-dir"
          TRAIN_EPISODES="250000"
          ;;
        walker)
          ENV_NAME="walker-param"
          TRAIN_EPISODES="250000"
          ;;
        cheetah)
          ENV_NAME="cheetah-vel"
          TRAIN_EPISODES="50000"
          ;;
        hopper)
          ENV_NAME="hopper-param"
          TRAIN_EPISODES="100000"
          ;;
        *)
          echo "[ERROR] Unknown environment key: {env_key}" >&2
          exit 2
          ;;
      esac

      case "{model_width}" in
        oracle_h512|oracle_h1024)
          SEQ_CONFIG="markov_default"
          MODEL_FLAGS="--config_seq.seq_model.is_oracle=True --config_seq.project_output=False"
          ;;
        markov_h512|markov_h1024)
          SEQ_CONFIG="markov_default"
          MODEL_FLAGS="--config_seq.seq_model.is_oracle=False --config_seq.project_output=False"
          ;;
        mate_h256|mate_h512)
          SEQ_CONFIG="mate_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer={n_layer} --config_seq.project_output=False"
          ;;
        mate_proj_h256|mate_proj_h512)
          SEQ_CONFIG="mate_default"
          MODEL_FLAGS="--config_seq.seq_model.n_layer={n_layer} --config_seq.project_output=True"
          ;;
        *)
          echo "[ERROR] Unknown model-width setting: {model_width}" >&2
          exit 2
          ;;
      esac
      HIDDEN_SIZE=$$(printf '%s' "{model_width}" | sed 's/.*_h//')

      RESUME_DIR=${BASE_DIR}/mujoco/$$ENV_NAME/$$AMLT_JOB_NAME\_$$AMLT_EXPERIMENT_NAME
      if [ -f "$$RESUME_DIR/training_checkpoint.pth" ]; then
        echo "[INFO] Resuming from $$RESUME_DIR"
        RESUME_FLAG="--resume $$RESUME_DIR"
      else
        echo "[INFO] Fresh scratch run (no checkpoint at $$RESUME_DIR)"
        RESUME_FLAG=""
      fi

      conda run --no-capture-output --name mate \
        python main.py \
        --config_env=configs/envs/mujoco.py \
        --config_env.env_name=$$ENV_NAME \
        --config_rl=configs/rl/sac_default.py \
        --config_seq=configs/seq_models/$$SEQ_CONFIG.py \
        --config_seq.seq_model.hidden_size=$$HIDDEN_SIZE \
        --config_seq.conditioning_hidden_dim=$$HIDDEN_SIZE \
        --config_seq.conditioning_n_layer={n_layer} \
        $$MODEL_FLAGS \
        --max_seq_len=32 \
        --train_episodes=$$TRAIN_EPISODES \
        --seed={seed} \
        --device=0 \
        --run_name=$$AMLT_JOB_NAME \
        --timestamp=$$AMLT_EXPERIMENT_NAME \
        --save_dir=${BASE_DIR} \
        $$RESUME_FLAG

  type: grid
  max_trials: 576
  params:
    - name: env_key
      spec: discrete
      values: [ant, walker, cheetah, hopper]
    - name: model_width
      spec: discrete
      values:
        - oracle_h512
        - oracle_h1024
        - markov_h512
        - markov_h1024
        - mate_h256
        - mate_h512
        - mate_proj_h256
        - mate_proj_h512
    - name: n_layer
      spec: discrete
      values: [1, 2, 4]
    - name: seed
      spec: discrete
      values: [0, 1, 2, 3, 4, 5]
